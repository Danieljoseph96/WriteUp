<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f3ee" />
    <title>WriteUp - Page not found</title>
    <style>
      :root {
        color-scheme: light;
        --text: #1f2530;
        --muted: #5f6878;
        --accent: #2f7d7d;
        --surface: rgba(255, 255, 255, 0.84);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(47, 125, 125, 0.18), transparent 34%),
          radial-gradient(circle at bottom right, rgba(111, 120, 232, 0.16), transparent 32%),
          linear-gradient(180deg, #f8f6f2 0%, #f1eee8 100%);
      }

      .card {
        width: min(100%, 560px);
        padding: 32px;
        border: 1px solid rgba(31, 37, 48, 0.08);
        border-radius: 28px;
        background: var(--surface);
        backdrop-filter: blur(14px);
        box-shadow: 0 30px 80px rgba(39, 47, 62, 0.12);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 5vw, 3.4rem);
        line-height: 1.02;
        letter-spacing: -0.05em;
      }

      p {
        margin: 16px 0 0;
        color: var(--muted);
        line-height: 1.7;
        font-size: 1rem;
      }

      .actions {
        margin-top: 24px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
      }

      .button--primary {
        color: #fff;
        background: linear-gradient(135deg, #2f7d7d, #6f78e8);
        box-shadow: 0 12px 28px rgba(47, 125, 125, 0.18);
      }

      .button--secondary {
        color: var(--text);
        border: 1px solid rgba(31, 37, 48, 0.12);
        background: rgba(255, 255, 255, 0.82);
      }

      .status {
        margin-top: 18px;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(47, 125, 125, 0.08);
        color: var(--text);
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">404 Error</p>
      <h1>Page not found.</h1>
      <p>
        The link you opened does not exist on this site. You can return to the WriteUp homepage or go back to the
        previous page.
      </p>
      <div class="actions">
        <a class="button button--primary" href="/writeup/">Go to homepage</a>
        <a class="button button--secondary" href="javascript:history.back()">Go back</a>
      </div>
      <div class="status">If you expected this page to load, check the URL for a typo or refresh the homepage.</div>
    </main>
  </body>
</html>
